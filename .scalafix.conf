rules = [
    ExplicitResultTypes,
    NoAutoTupling,
    OrganizeImports,
    RemoveUnused,
    DisableSyntax,
    LeakingImplicitClassVal,
    NoValInForComprehension,
    ProcedureSyntax,
    RedundantSyntax,
]

OrganizeImports {
    # Six names stay explicit. Seven or more still coalesce.
    coalesceToWildcardImportThreshold = 6
    expandRelative = false
    groupedImports = Merge
    groups = [
        "java."
        "scala."
        "*"
        "com.ewoodbury.scarlet"
    ]
    targetDialect = Scala3
}
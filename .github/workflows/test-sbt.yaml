name: SBT Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'
          
      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Lint check
        run: make test-lint

      - name: Run tests
        run: sbt test

      - name: Performance smoke check
        run: sbt "scarlet-tests/Test/runMain com.ewoodbury.scarlet.execution.PerfCheck"